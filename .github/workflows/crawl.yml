name: Crawl Naver blog posts

on:
  schedule:
    # Every day at 21:00 UTC (06:00 KST)
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        run: python crawler.py --blog-id skckckskckck --out posts

      - name: Sync new posts to Google Drive
        if: ${{ env.GDRIVE_SA_KEY != '' && env.GDRIVE_FOLDER_ID != '' }}
        run: |
          echo "$GDRIVE_SA_KEY" > /tmp/gdrive-key.json
          python sync_to_drive.py --key-file /tmp/gdrive-key.json --folder-id "$GDRIVE_FOLDER_ID" --source posts
          rm -f /tmp/gdrive-key.json

      - name: Commit new posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "Crawl new blog posts"
            git push
          fi
