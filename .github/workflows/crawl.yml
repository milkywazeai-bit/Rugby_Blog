name: Crawl Naver blog posts

on:
  schedule:
    # Every day at 21:00 UTC (06:00 KST)
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        run: python crawler.py --blog-id skckckskckck --out posts

      - name: Sync new posts to Google Drive
        if: ${{ env.GDRIVE_REFRESH_TOKEN != '' && env.GDRIVE_FOLDER_ID != '' }}
        run: |
          python sync_to_drive.py \
            --client-id "$GDRIVE_CLIENT_ID" \
            --client-secret "$GDRIVE_CLIENT_SECRET" \
            --refresh-token "$GDRIVE_REFRESH_TOKEN" \
            --folder-id "$GDRIVE_FOLDER_ID" \
            --source posts

      - name: Commit new posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No new posts."
          else
            git commit -m "Crawl new blog posts"
            git push
          fi
